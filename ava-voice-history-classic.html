<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmission Log</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-dim: #8a6e30;
    --gold-bright: #f0d080;
    --bg-deep: #05060f;
    --bg-mid: #080c1a;
    --text-main: #cdd4e8;
    --text-dim: #7a8aaa;
    --text-alien: #d4b875;
    --accent-teal: #4ecdc4;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }

  /* ── Starfield ── */
  #stars {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── Constellation lines ── */
  #constellation {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    opacity: 0.25;
  }

  /* ── Main layout ── */
  #frame {
    position: fixed; inset: 0; z-index: 10;
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    grid-template-rows: 64px 1fr 64px;
    padding: 12px;
    gap: 0;
  }

  /* ── Gold border corners ── */
  .corner {
    position: relative;
  }
  .corner svg { width: 100%; height: 100%; }

  /* ── Top/bottom bars ── */
  .bar-top, .bar-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 8px;
  }

  .bar-symbols {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .25em;
    color: var(--gold-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bar-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    flex-shrink: 0;
  }

  .bar-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 30%, var(--gold-dim) 70%, transparent);
  }

  /* ── Side runes ── */
  .side-runes {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 4px 0;
  }

  .rune {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--gold-dim);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: .15em;
    opacity: 0.7;
  }

  /* ── Gold border lines ── */
  .border-top, .border-bottom {
    position: relative;
  }
  .border-top::after, .border-bottom::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent);
  }
  .border-top::after { bottom: 0; }
  .border-bottom::after { top: 0; }

  .border-left, .border-right {
    position: relative;
  }
  .border-left::after, .border-right::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent);
  }
  .border-left::after { right: 0; }
  .border-right::after { left: 0; }

  /* ── Center chat panel ── */
  #chat-panel {
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  #chat-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .4em;
    color: var(--gold-dim);
    text-align: center;
    padding: 8px 0 6px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(201,168,76,.12);
    flex-shrink: 0;
  }

  #chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 12px 8px;
    scroll-behavior: smooth;
  }

  #chat-scroll::-webkit-scrollbar { width: 3px; }
  #chat-scroll::-webkit-scrollbar-track { background: transparent; }
  #chat-scroll::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  /* ── Chat messages ── */
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.03);
    animation: fadeRow .4s ease both;
  }

  @keyframes fadeRow {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-sender {
    font-size: 11px;
    color: var(--gold-dim);
    white-space: nowrap;
    min-width: 56px;
    padding-top: 1px;
    letter-spacing: .05em;
  }

  .msg-sender.bot {
    color: var(--accent-teal);
  }

  .msg-divider {
    color: rgba(255,255,255,.2);
    font-size: 11px;
    padding-top: 1px;
    flex-shrink: 0;
  }

  .msg-body {
    flex: 1;
    font-size: 12.5px;
    color: var(--text-main);
    line-height: 1.55;
    letter-spacing: .03em;
  }

  .msg-body.bot-text {
    color: #b0e8e4;
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    padding-top: 2px;
    flex-shrink: 0;
    opacity: .6;
  }

  /* system line */
  .msg-system {
    text-align: center;
    font-size: 10px;
    color: var(--gold-dim);
    overflow-wrap: anywhere;
    letter-spacing: .25em;
    padding: 10px 0 6px;
    opacity: .5;
  }

  /* ── Input area ── */
  #chat-input-area {
    border-top: 1px solid rgba(201,168,76,.15);
    padding: 8px 8px 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  #chat-input {
    flex: 1;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(201,168,76,.2);
    border-radius: 3px;
    padding: 6px 10px;
    color: var(--text-main);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    outline: none;
    caret-color: var(--gold);
  }
  #chat-input::placeholder { color: var(--text-dim); opacity: .5; }
  #chat-input:focus { border-color: rgba(201,168,76,.5); }

  #send-btn {
    background: rgba(201,168,76,.1);
    border: 1px solid rgba(201,168,76,.3);
    border-radius: 3px;
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .15em;
    padding: 6px 14px;
    cursor: pointer;
    transition: all .2s;
  }
  #send-btn:hover {
    background: rgba(201,168,76,.2);
    border-color: var(--gold);
  }

  /* ── Scanning line ── */
  #scan-line {
    position: fixed;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,.15) 50%, transparent);
    pointer-events: none;
    z-index: 5;
    animation: scan 8s linear infinite;
  }
  @keyframes scan {
    0%   { top: 0%; opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* ── Corner SVG ornaments ── */
  .corner-svg { color: var(--gold-dim); }

  /* ── Ping dot on new message ── */
  .ping {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent-teal);
    margin-right: 4px;
    vertical-align: middle;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
<body>

<!-- Starfield canvas -->
<canvas id="stars"></canvas>

<!-- Constellation SVG -->
<svg id="constellation" xmlns="http://www.w3.org/2000/svg"></svg>

<!-- Scanning line -->
<div id="scan-line"></div>

<!-- Main frame grid -->
<div id="frame">

  <!-- Row 1: top-left corner, top bar, top-right corner -->
  <div class="corner border-top border-left" style="grid-column:1;grid-row:1;">
    <svg viewBox="0 0 52 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M52 64 L8 64 L8 52 L2 52 L2 8 L52 8" stroke="#8a6e30" stroke-width="1" fill="none"/>
      <circle cx="8" cy="8" r="3" fill="#c9a84c"/>
      <line x1="12" y1="8" x2="52" y2="8" stroke="#8a6e30" stroke-width=".5"/>
      <line x1="8" y1="12" x2="8" y2="64" stroke="#8a6e30" stroke-width=".5"/>
      <circle cx="8" cy="52" r="2" fill="#8a6e30"/>
      <line x1="10" y1="52" x2="24" y2="52" stroke="#8a6e30" stroke-width=".5" opacity=".5"/>
    </svg>
  </div>

  <div class="bar-top border-top" style="grid-column:2;grid-row:1;">
    <div class="bar-line"></div>
    <div class="bar-symbols">✦ SYNAPSES TRANSMISSION LOG ✦</div>
    <div class="bar-dot"></div>
    <div class="bar-symbols" id="top-time">◈ 00:00:00 ◈</div>
    <div class="bar-line"></div>
  </div>

  <div class="corner border-top border-right" style="grid-column:3;grid-row:1;">
    <svg viewBox="0 0 52 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 64 L44 64 L44 52 L50 52 L50 8 L0 8" stroke="#8a6e30" stroke-width="1" fill="none"/>
      <circle cx="44" cy="8" r="3" fill="#c9a84c"/>
      <line x1="0" y1="8" x2="40" y2="8" stroke="#8a6e30" stroke-width=".5"/>
      <line x1="44" y1="12" x2="44" y2="64" stroke="#8a6e30" stroke-width=".5"/>
      <circle cx="44" cy="52" r="2" fill="#8a6e30"/>
      <line x1="28" y1="52" x2="42" y2="52" stroke="#8a6e30" stroke-width=".5" opacity=".5"/>
    </svg>
  </div>

  <!-- Row 2: left runes, chat panel, right runes -->
  <div class="border-left side-runes" style="grid-column:1;grid-row:2;">
    <div class="rune">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ</div>
  </div>

  <div id="chat-panel" style="grid-column:2;grid-row:2;">
    <div id="chat-title">◈ ACTIVE CHANNEL · ENTITY LINK · SIGNAL CLEAR ◈</div>
    <div id="chat-scroll"></div>

  </div>

  <div class="border-right side-runes" style="grid-column:3;grid-row:2;">
    <div class="rune">ᛟᛞᛜᛚᛗᛖᛒᛏᛊᛉᛈᛇᛃᛁᛜᚾᚺᚹᚷᚲᚱᚨᚦᚢᚠ</div>
  </div>

  <!-- Row 3: bottom-left, bottom bar, bottom-right -->
  <div class="corner border-bottom border-left" style="grid-column:1;grid-row:3;">
    <svg viewBox="0 0 52 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M52 0 L8 0 L8 12 L2 12 L2 56 L52 56" stroke="#8a6e30" stroke-width="1" fill="none"/>
      <circle cx="8" cy="56" r="3" fill="#c9a84c"/>
      <line x1="12" y1="56" x2="52" y2="56" stroke="#8a6e30" stroke-width=".5"/>
      <line x1="8" y1="0" x2="8" y2="52" stroke="#8a6e30" stroke-width=".5"/>
      <circle cx="8" cy="12" r="2" fill="#8a6e30"/>
    </svg>
  </div>

  <div class="bar-bottom border-bottom" style="grid-column:2;grid-row:3;gap:8px;">
    <div class="bar-line"></div>
    <div class="bar-symbols" id="msg-count">◈ 0 CHATS ◈</div>
    <div class="bar-dot"></div>
    <div id="page-nav" style="display:flex;align-items:center;gap:10px;"></div>
    <div class="bar-dot"></div>
    <button id="clear-btn" onclick="clearTranscript()" style="background:rgba(255,80,80,0.06);border:1px solid rgba(255,80,80,0.25);color:rgba(255,100,100,0.55);font-family:'Cinzel',serif;font-size:9px;letter-spacing:.15em;padding:4px 12px;border-radius:3px;cursor:pointer;transition:all .2s;">✕ CLEAR</button>
    <div class="bar-line"></div>
  </div>

  <div class="corner border-bottom border-right" style="grid-column:3;grid-row:3;">
    <svg viewBox="0 0 52 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0 L44 0 L44 12 L50 12 L50 56 L0 56" stroke="#8a6e30" stroke-width="1" fill="none"/>
      <circle cx="44" cy="56" r="3" fill="#c9a84c"/>
      <line x1="0" y1="56" x2="40" y2="56" stroke="#8a6e30" stroke-width=".5"/>
      <line x1="44" y1="0" x2="44" y2="52" stroke="#8a6e30" stroke-width=".5"/>
      <circle cx="44" cy="12" r="2" fill="#8a6e30"/>
    </svg>
  </div>

</div>

<!-- AVA_VOICE_HISTORY_DATA -->
<script>
// ── Stars ────────────────────────────────────────────────────────
(function(){
  var c = document.getElementById('stars');
  var ctx = c.getContext('2d');
  var stars = [];

  function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    draw();
  }

  function init(){
    stars = [];
    for(var i=0;i<280;i++){
      stars.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        r: Math.random()*1.4+.2,
        a: Math.random()*.8+.2,
        speed: Math.random()*.0003+.0001,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  var t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    var g = ctx.createRadialGradient(c.width/2,c.height/2,0,c.width/2,c.height/2,c.width*.8);
    g.addColorStop(0,'#080c1a');
    g.addColorStop(1,'#03040a');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,c.width,c.height);
    t += .016;
    stars.forEach(function(s){
      var pulse = s.a * (.7 + .3*Math.sin(t*s.speed*200 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(200,215,255,'+pulse+')';
      ctx.fill();
    });
  }

  init(); resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 50);
})();

// ── Constellations ───────────────────────────────────────────────
(function(){
  var svg = document.getElementById('constellation');
  var W = window.innerWidth, H = window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);

  var points = [
    [.08,.15],[.12,.35],[.18,.22],[.07,.48],[.15,.6],
    [.22,.72],[.3,.55],[.25,.38],[.35,.25],[.42,.4],
    [.5,.18],[.58,.32],[.65,.15],[.72,.3],[.78,.5],
    [.85,.35],[.9,.2],[.88,.6],[.75,.68],[.62,.72],
    [.55,.58],[.45,.65],[.38,.78],[.28,.85],[.18,.88]
  ].map(function(p){ return [p[0]*W, p[1]*H]; });

  var edges = [
    [0,1],[1,2],[2,0],[1,3],[3,4],[4,5],[5,6],[6,7],
    [7,2],[7,8],[8,9],[9,10],[10,11],[11,12],[12,13],
    [13,14],[14,15],[15,16],[14,17],[17,18],[18,19],
    [19,20],[20,21],[21,22],[22,23],[23,24],[24,4],
    [6,20],[9,21],[11,19]
  ];

  edges.forEach(function(e){
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', points[e[0]][0]);
    line.setAttribute('y1', points[e[0]][1]);
    line.setAttribute('x2', points[e[1]][0]);
    line.setAttribute('y2', points[e[1]][1]);
    line.setAttribute('stroke','rgba(180,160,100,.4)');
    line.setAttribute('stroke-width','.5');
    svg.appendChild(line);
  });

  points.forEach(function(p){
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]);
    c.setAttribute('r', Math.random()>.7?2:1.2);
    c.setAttribute('fill','rgba(220,200,140,.7)');
    svg.appendChild(c);
  });
})();

// ── Clock ────────────────────────────────────────────────────────
function updateClock(){
  var d = new Date();
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  var s = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('top-time').textContent = '\u25c8 '+h+':'+m+':'+s+' \u25c8';
}
setInterval(updateClock,1000);
updateClock();

// ── Pagination engine ─────────────────────────────────────────────
var _sessions = [];
var _currentPage = 0;

function totalPages() { return Math.max(1, _sessions.length); }

function appendMessage(scroll, sender, text, iso, bot) {
  var message = document.createElement('div');
  message.className = 'msg-row';
  var label = document.createElement('span');
  label.className = bot ? 'msg-sender bot' : 'msg-sender';
  label.textContent = sender;
  var divider = document.createElement('span');
  divider.className = 'msg-divider';
  divider.textContent = '\u2502';
  var body = document.createElement('span');
  body.className = bot ? 'msg-body bot-text' : 'msg-body';
  body.textContent = typeof text === 'string' ? text : '';
  var time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = fmtTime(iso);
  message.append(label, divider, body, time);
  scroll.appendChild(message);
}

function renderPage(page) {
  _currentPage = page;
  var scroll = document.getElementById('chat-scroll');
  var content = document.createDocumentFragment();
  var session = _sessions[page];
  var system = document.createElement('div');
  system.className = 'msg-system';
  system.textContent = session
    ? session.title || 'Voice conversation'
    : '\u2014 NO TRANSMISSIONS \u2014';
  content.appendChild(system);
  if (session) session.turns.forEach(function(entry) {
    if (!entry) return;
    if (entry.user) appendMessage(content, 'User', entry.user, entry.date, false);
    if (entry.ava) appendMessage(content, 'Entity', entry.ava, entry.date, true);
  });
  scroll.replaceChildren(content);
  scroll.scrollTop = 0;

  document.getElementById('msg-count').textContent = '\u25c8 ' + _sessions.length + (_sessions.length === 1 ? ' CHAT ' : ' CHATS ') + '\u25c8';
  document.getElementById('clear-btn').disabled = !_sessions.length;
  updatePageNav();
}

function updatePageNav() {
  var nav = document.getElementById('page-nav');
  var pg = _currentPage;
  var tp = totalPages();
  nav.innerHTML = '';

  if (pg > 0) {
    var pb = document.createElement('button');
    pb.textContent = '\u25c4 NEWER';
    pb.style.cssText = 'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);color:rgba(201,168,76,.7);font-family:"Cinzel",serif;font-size:10px;letter-spacing:.1em;padding:4px 12px;border-radius:3px;cursor:pointer;';
    pb.addEventListener('mouseenter', function(){ pb.style.background='rgba(201,168,76,.18)'; pb.style.color='rgba(201,168,76,1)'; });
    pb.addEventListener('mouseleave', function(){ pb.style.background='rgba(201,168,76,.08)'; pb.style.color='rgba(201,168,76,.7)'; });
    pb.onclick = function(){ renderPage(pg - 1); };
    nav.appendChild(pb);
  }

  var lbl = document.createElement('span');
  lbl.style.cssText = 'font-family:"Cinzel",serif;font-size:10px;letter-spacing:.2em;color:rgba(201,168,76,.35);';
  lbl.textContent = (pg + 1) + ' / ' + tp;
  nav.appendChild(lbl);

  if (pg < tp - 1) {
    var nb = document.createElement('button');
    nb.textContent = 'OLDER \u25ba';
    nb.style.cssText = 'background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);color:rgba(201,168,76,.7);font-family:"Cinzel",serif;font-size:10px;letter-spacing:.1em;padding:4px 12px;border-radius:3px;cursor:pointer;';
    nb.addEventListener('mouseenter', function(){ nb.style.background='rgba(201,168,76,.18)'; nb.style.color='rgba(201,168,76,1)'; });
    nb.addEventListener('mouseleave', function(){ nb.style.background='rgba(201,168,76,.08)'; nb.style.color='rgba(201,168,76,.7)'; });
    nb.onclick = function(){ renderPage(pg + 1); };
    nav.appendChild(nb);
  }
}

function fmtTime(iso) {
  if (typeof iso !== 'string' || !iso) return '';
  var date = new Date(iso);
  if (!Number.isFinite(date.getTime())) return '';
  return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}

function clearTranscript() {
  if (_sessions.length && parent !== window) parent.postMessage({type: 'COSMIC_CLEAR_TRANSCRIPT'}, '*');
}

function loadHistory(history, selectedPage) {
  _sessions = Array.isArray(history) ? history.filter(function(session) {
    return session && Array.isArray(session.turns) && session.turns.length;
  }) : [];
  renderPage(Number.isInteger(selectedPage) && selectedPage >= 0 && selectedPage < _sessions.length ? selectedPage : 0);
}

window.addEventListener('message', function(event) {
  if (parent === window || event.source !== parent || !event.data || event.data.type !== 'SYNAPSES_HISTORY') return;
  loadHistory(event.data.history);
});

var initialData = document.getElementById('avaClassicHistoryData');
var initialHistory = initialData ? JSON.parse(initialData.textContent) : {};
loadHistory(initialHistory.sessions, initialHistory.page);
</script>
</body>
</html>
